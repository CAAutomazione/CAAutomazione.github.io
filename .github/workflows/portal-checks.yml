name: Portal checks
on:
  pull_request:
    paths:
      - 'portale-clienti/**'
      - '.github/workflows/portal-checks.yml'
  push:
    branches:
      - area-clienti-portale
    paths:
      - 'portale-clienti/**'
      - '.github/workflows/portal-checks.yml'
jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpass"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo
      - name: Validate Composer manifest
        working-directory: portale-clienti
        run: composer validate --strict
      - name: Check PHP syntax
        run: find portale-clienti -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install portal dependencies
        working-directory: portale-clienti
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Check document authorization across companies
        working-directory: portale-clienti
        run: bash tests/smoke.sh
      - name: Build and start interactive demo
        run: docker compose -f .devcontainer/docker-compose.yml up -d --build
      - name: Verify demo login screen
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ | grep -q 'Area Clienti'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f .devcontainer/docker-compose.yml logs app db
          exit 1
      - name: Verify presentation data and private access
        run: |
          docker compose -f .devcontainer/docker-compose.yml exec -T app php -r 'require "portale-clienti/src/Core.php"; $c=Portal\Core::row("SELECT COUNT(*) n FROM companies"); $u=Portal\Core::row("SELECT COUNT(*) n FROM users WHERE role=?",["client"]); $d=Portal\Core::row("SELECT COUNT(*) n FROM documents"); $a=Portal\Core::row("SELECT COUNT(*) n FROM documents WHERE first_download_at IS NOT NULL"); if ($c["n"]<5 || $u["n"]<10 || $d["n"]<15 || $a["n"]<5 || !is_file("/private-documents/.demo-admin-login")) exit(1);'
      - name: Verify demo administrator login and session
        run: bash portale-clienti/tests/demo-login.sh
      - name: Check release contents
        run: |
          test ! -e portale-clienti/config.php
          test -f portale-clienti/vendor/autoload.php
      - uses: actions/upload-artifact@v4
        with:
          name: portale-clienti-tophost
          path: |
            portale-clienti/public/
            portale-clienti/src/
            portale-clienti/vendor/
            portale-clienti/sql/
            portale-clienti/config.example.php
            portale-clienti/bin.php
            portale-clienti/README.md
            portale-clienti/TOPHOST.md
          if-no-files-found: error
          retention-days: 30
      - name: Stop demo
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down -v || true
