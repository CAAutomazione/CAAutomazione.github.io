services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: portal_demo
      MYSQL_USER: portal_demo
      MYSQL_PASSWORD: demo-only-password
      MYSQL_ROOT_PASSWORD: demo-only-root-password
    volumes:
      - demo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pdemo-only-root-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    environment:
      PORTAL_DEMO: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/workspace
      - demo_documents:/private-documents
    ports:
      - "127.0.0.1:8000:8000"
    command: ["bash", ".devcontainer/start-demo.sh"]
volumes:
  demo_mysql:
  demo_documents:
